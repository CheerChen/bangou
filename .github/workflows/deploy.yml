# Builds bangou natively on the Pi (arm64) and deploys the compose stack.
# Runs on the self-hosted runner — the only job that needs LAN access
# (private registry + /opt/stacks).
#
# Runner note: self-hosted runners are registered per account. The Pi runner
# serving CheerChen/* cannot pick up jobs for zeroAlcBeer/* — register a
# second runner instance on the same Pi under this repo (or the zeroAlcBeer
# account) with labels [self-hosted, pi].
#
# SECURITY NOTE (public repo): this workflow must never gain a pull_request
# trigger — it executes on the Pi and only the repo owner can push master.
name: Deploy

on:
  push:
    branches: [master]
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "frontend/**"
      - "Dockerfile"
      - "Dockerfile.frontend"
      - "nginx.conf"
      - "entrypoint.sh"
      - ".github/workflows/deploy.yml"

concurrency:
  group: deploy-bangou
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: [self-hosted, pi]
    env:
      REGISTRY: 192.168.0.110:5000
      STACK_DIR: /opt/stacks/bangou
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Gate the deploy on tests, not just a successful build.
      - run: go vet ./...
      - run: go test ./...
      - name: Build images (native arm64)
        run: |
          SHA=${GITHUB_SHA::12}
          docker build -f Dockerfile --build-arg BUILD_SHA=$SHA \
            -t "$REGISTRY/bangou-api:$SHA" -t "$REGISTRY/bangou-api:latest" .
          docker build -f Dockerfile.frontend \
            -t "$REGISTRY/bangou-web:$SHA" -t "$REGISTRY/bangou-web:latest" .
      - name: Push (immutable SHA tags + latest aliases)
        run: |
          SHA=${GITHUB_SHA::12}
          docker push "$REGISTRY/bangou-api:$SHA"
          docker push "$REGISTRY/bangou-api:latest"
          docker push "$REGISTRY/bangou-web:$SHA"
          docker push "$REGISTRY/bangou-web:latest"
      - name: Deploy stack
        # The stack pins immutable SHA tags — rewrite them to this build's
        # tag, then up. (compose.yaml is also Dockge-managed; only the tag
        # is touched.) Images were built on this host, so no pull needed.
        run: |
          SHA=${GITHUB_SHA::12}
          cd "$STACK_DIR"
          sudo sed -i -E "s#(bangou-(api|web)):[A-Za-z0-9._-]+#\1:$SHA#" compose.yaml
          sudo docker compose up -d
      - name: Verify
        run: |
          # Hits the web container, which proxies /api to the api container —
          # and checks the reported build SHA so a stale deploy can't pass.
          SHA=${GITHUB_SHA::12}
          for i in $(seq 1 18); do
            got=$(curl -s http://127.0.0.1:8890/api/healthz | jq -r .sha 2>/dev/null || true)
            if [ "$got" = "$SHA" ]; then echo "healthy on $SHA after $((i*5))s"; exit 0; fi
            sleep 5
          done
          echo "expected sha $SHA, last seen: ${got:-none}"
          exit 1
