services:
  bangou:
    image: ${IMAGE:-192.168.0.110:5000/bangou:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bangou
    ports:
      - "8080:8080"
    volumes:
      # Mount parent directories so multiple pipelines can use sub-paths
      - /mnt/hd1/Download:/mnt/hd1/Download:rw
      - /mnt/hd1/Multimedia:/mnt/hd1/Multimedia:rw
      - ./data:/data
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Tokyo
    command:
      - --db=/data/bangou.db
      - --listen=:8080
    restart: unless-stopped
